# Federated Learning 5G trên Docker: 1 SuperLink (Cloud) + 20 SuperNode (Edge, mỗi node = 1 trạm phát)
# Bật:  docker compose up -d --build                       (cả 20 trạm)
#       docker compose up -d --build superlink supernode-0 supernode-1 supernode-2 supernode-3 supernode-4   (5 trạm)
x-supernode: &supernode
  image: fl5g:latest
  entrypoint: ["flower-supernode"]
  pull_policy: never        # image tự build, không kéo từ Docker Hub
  depends_on: [superlink]
  volumes:
    - ${FL5G_DATA_HOST}:/data:ro
  restart: on-failure

services:
  superlink:
    build:
      context: .
      args:
        FLWR_VERSION: ${FLWR_VERSION}
    image: fl5g:latest
    container_name: superlink
    entrypoint: ["flower-superlink"]
    command: ["--insecure"]
    ports:
      - "9093:9093"   # flwr run (Control API)
      - "9092:9092"   # Fleet API (SuperNode kết nối vào)
    volumes:
      - ${FL5G_DATA_HOST}:/data:ro
      - ${FL5G_OUT_HOST}:/results

  supernode-0:
    <<: *supernode
    container_name: supernode-0
    command: ["--insecure", "--superlink", "superlink:9092", "--node-config", "partition-id=0 num-partitions=20"]

  supernode-1:
    <<: *supernode
    container_name: supernode-1
    command: ["--insecure", "--superlink", "superlink:9092", "--node-config", "partition-id=1 num-partitions=20"]

  supernode-2:
